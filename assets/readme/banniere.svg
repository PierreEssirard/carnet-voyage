<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
<style>
  .titre{font:600 52px Georgia,"Times New Roman",serif;fill:#e9edf1;opacity:0;animation:monte 1.2s .2s ease-out forwards}
  .titre tspan{font-style:italic;font-weight:400;fill:#ff9f0a}
  .sous{font:400 17px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#8794a3;opacity:0;animation:monte 1.2s .6s ease-out forwards}
  .vol{fill:none;stroke:#8794a3;stroke-width:2;stroke-dasharray:4 8;opacity:.6}
  .ville{font:500 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#c9d1da}
  .halo{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes monte{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(3);opacity:0}}
  @media (prefers-reduced-motion:reduce){.titre,.sous{animation:none;opacity:1}.halo{animation:none}}
</style>
<rect width="900" height="260" rx="18" fill="#07090d"/>
<text class="titre" x="450" y="92" text-anchor="middle">Carnet <tspan>de voyages</tspan></text>
<text class="sous" x="450" y="126" text-anchor="middle">4 mois entre le Canada et les États-Unis · Montréal + 5 road trips</text>
<path id="vol" class="vol" d="M780,215 C620,140 300,140 120,215"/>
<circle cx="780" cy="215" r="5" fill="#8794a3"/>
<text class="ville" x="780" y="242" text-anchor="middle">Paris</text>
<circle class="halo" cx="120" cy="215" r="6" fill="none" stroke="#ff453a" stroke-width="2"/>
<circle cx="120" cy="215" r="6" fill="#ff453a" stroke="#fff" stroke-width="2"/>
<text class="ville" x="120" y="242" text-anchor="middle">Montréal</text>
<g>
  <path d="M12,0 L-6,-4 L-10,-12 L-14,-12 L-11,-3 L-16,-2 L-18,-6 L-21,-6 L-19,0 L-21,6 L-18,6 L-16,2 L-11,3 L-14,12 L-10,12 L-6,4 Z" fill="#e9edf1"/>
  <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear"><mpath href="#vol"/></animateMotion>
</g>
</svg>