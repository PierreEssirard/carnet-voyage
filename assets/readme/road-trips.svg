<style>
  .route{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:trace 9s ease-in-out infinite}
  .pt{opacity:0;animation:pop 9s ease-out infinite}
  .lbl{font:500 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#c9d1da;opacity:0;animation:pop 9s ease-out infinite}
  .base{animation:pulse 2.2s ease-out infinite;transform-origin:485.7px 206.2px}
  @keyframes trace{0%{stroke-dashoffset:var(--l)}45%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  @keyframes pop{0%,10%{opacity:0}20%,85%{opacity:1}100%{opacity:0}}
  @keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(3.2);opacity:0}}
  @media (prefers-reduced-motion:reduce){.route{animation:none;stroke-dashoffset:0}.pt,.lbl{animation:none;opacity:1}.base{animation:none}}
</style>
