<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carnet de voyages — Pierre Essirard</title>
  <meta name="description" content="Montréal et mes road trips en Amérique du Nord, étape par étape.">
  <meta name="theme-color" content="#0b0907">
  <meta name="color-scheme" content="dark">

  <!-- Titres et texte : Inter (fin) · Interface : IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- MapLibre (carte vectorielle + bâtiments 3D, sans clé API) -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

  <!-- Styles du site -->
  <link href="css/style.css?v=13" rel="stylesheet">
  <link href="css/prive.css?v=5" rel="stylesheet">
</head>
<body class="en-vol">
  <!-- INTRO : la planète et le vol Paris → Montréal (js/intro.js) -->
  <section id="intro" aria-label="Introduction : vol de Paris à Montréal">
    <div class="intro-scene">
      <canvas aria-hidden="true"></canvas>

      <div class="intro-haut">
        <span>Pierre Essirard</span>
        <span class="intro-haut-c">Carnet n°&nbsp;01 — Amérique du Nord</span>
        <span>Canada · États-Unis</span>
      </div>

      <h1 class="intro-titre" aria-label="Carnet de voyages">
        <span class="im"><span>Carnet</span></span> <span class="im"><span><em>de</em></span></span> <span class="im"><span><em>voyages</em></span></span>
      </h1>

      <div class="intro-indice"><span>Défiler pour décoller</span><i></i></div>

      <div class="intro-legendes" aria-hidden="true"></div>

      <div class="intro-piste" aria-hidden="true">
        <span>CDG</span><div><b></b><i></i></div><span>YUL</span>
      </div>

      <div class="intro-km" aria-hidden="true"><b>0</b><span>km</span></div>

      <p class="intro-bienvenue" aria-hidden="true"><span class="im"><span>Bienvenue</span></span> <span class="im"><span><em>à Montréal.</em></span></span></p>
    </div>
  </section>

  <div id="progress" aria-hidden="true"></div>

  <div id="mapwrap">
    <div id="map" aria-label="Carte interactive des voyages"></div>
    <div class="maptag" aria-live="polite">
      <span class="maptag-dot"></span>
      <span id="maptag-txt">Montréal</span>
    </div>
    <button id="map-toggle" class="map-toggle" type="button" aria-label="Réduire la carte" title="Réduire la carte">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path class="ic-min" d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>
        <path class="ic-max" d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
      </svg>
    </button>
    <!-- Téléphone : languette visible quand la carte est rangée sur le côté -->
    <button id="map-poignee" class="map-poignee" type="button" aria-label="Ramener la carte" title="Ramener la carte">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2zM9 4v14M15 6v14"/>
      </svg>
    </button>
  </div>

  <main id="story"></main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <!-- Globe de l'intro -->
  <script src="assets/vendor/d3-array.min.js"></script>
  <script src="assets/vendor/d3-geo.min.js"></script>
  <script src="assets/vendor/topojson-client.min.js"></script>
  <script type="module" src="js/main.js?v=13"></script>
  <script type="module" src="js/prive.js?v=5"></script>
</body>
</html>
